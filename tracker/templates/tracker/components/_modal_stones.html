<!-- Modal de Localización de Objeto / Piedra Evolutiva -->
<div id="stone-location-modal" class="fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200" onclick="handleStoneModalBackdropClick(event)">
    <!-- Panel de la Tarjeta del Objeto -->
    <div id="stone-modal-card" class="relative w-full max-w-lg bg-[#fffef5] text-slate-900 rounded-2xl comic-panel overflow-hidden transform scale-95 transition-all duration-200 shadow-2xl flex flex-col max-h-[90vh]">
        
        <!-- Cabecera estilo cómic -->
        <div class="{% if game.slug == 'blue' %}bg-blue-600{% elif game.slug == 'yellow' %}bg-amber-500 text-slate-950{% elif game.slug == 'gold' %}bg-[#c59b27] text-slate-950{% else %}bg-red-600 text-white{% endif %} border-b-4 border-slate-950 px-4 py-3 flex items-center justify-between comic-header-pattern relative overflow-hidden">
            <div class="flex items-center gap-2.5 z-10">
                <span class="border-2 border-slate-950 bg-amber-300 text-slate-950 font-black text-[10px] sm:text-xs uppercase px-2 py-0.5 rounded shadow-[2px_2px_0px_0px_#0f172a] transform -rotate-2">
                    Objeto Evolutivo • {{ game.display_name|upper }}
                </span>
                <h3 id="stone-modal-title" class="{% if game.slug == 'yellow' or game.slug == 'gold' %}text-slate-950{% else %}text-white{% endif %} font-black text-base sm:text-lg tracking-wide uppercase drop-shadow-[1.5px_1.5px_0px_#0f172a] flex items-center gap-2">
                    <img id="stone-modal-icon-header" src="" alt="" class="w-5 h-5 object-contain inline-block">
                    <span id="stone-modal-name">PIEDRA LUNAR</span>
                </h3>
            </div>

            <!-- Botón de Cerrar Cómic -->
            <button 
                type="button" 
                onclick="closeStoneModal()" 
                class="z-10 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-base sm:text-lg border-2 border-slate-950 shadow-[2px_2px_0px_0px_#0f172a] flex items-center justify-center transition-transform active:translate-x-0.5 active:translate-y-0.5"
                title="Cerrar ventana"
            >
                ✕
            </button>
        </div>

        <!-- Contenido scrollable -->
        <div class="p-4 sm:p-5 overflow-y-auto space-y-4">
            <!-- Ficha del Objeto -->
            <div class="bg-white border-2 border-slate-950 rounded-xl p-3.5 comic-card-inner flex items-center gap-3.5 shadow-sm">
                <div class="w-14 h-14 bg-slate-100 rounded-lg border-2 border-slate-950 flex items-center justify-center shrink-0 shadow-[2px_2px_0px_0px_#0f172a]">
                    <img id="stone-modal-img" src="" alt="" class="w-10 h-10 object-contain drop-shadow">
                </div>
                <div class="space-y-1 flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span id="stone-modal-badge-name" class="font-black text-sm uppercase text-slate-950"></span>
                        <span id="stone-modal-price-badge" class="border border-slate-950 text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded shadow-sm"></span>
                    </div>
                    <p id="stone-modal-description" class="text-xs text-slate-600 font-medium italic"></p>
                </div>
            </div>

            <!-- Lista de Localizaciones en este juego -->
            <div>
                <div class="inline-flex items-center gap-1.5 mb-2">
                    <span class="bg-emerald-300 border-2 border-slate-950 font-black text-[10px] sm:text-xs uppercase px-2 py-0.5 rounded shadow-[1.5px_1.5px_0px_0px_#0f172a] flex items-center gap-1">
                        <img src="/media/items/town-map.png" alt="Mapa" class="w-3.5 h-3.5 object-contain inline-block">
                        Dónde conseguirlo en {{ game.display_name }}
                    </span>
                </div>

                <div id="stone-modal-locations-list" class="space-y-2">
                    <!-- Generado dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Footer del modal de piedra -->
        <div class="bg-slate-100 border-t-2 border-slate-950 px-4 py-2.5 flex items-center justify-between">
            <span class="text-[11px] font-semibold text-slate-500">
                Guía de obtención de objetos evolutivos • Gen {{ game.generation }}
            </span>
            <button 
                type="button" 
                onclick="closeStoneModal()" 
                class="py-1 px-3 rounded-lg text-xs font-black uppercase border-2 border-slate-950 shadow-[1.5px_1.5px_0px_0px_#0f172a] bg-amber-400 hover:bg-amber-300 text-slate-950 transition-all active:translate-x-0.5 active:translate-y-0.5"
            >
                Entendido
            </button>
        </div>
    </div>
</div>
