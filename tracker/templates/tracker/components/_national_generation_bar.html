<!-- Barra de Navegación de Regiones / Generaciones (Exclusiva de Pokédex Nacional) -->
<div 
    id="national-generation-bar"
    data-game-slug="{{ game.slug }}"
    data-active-classes="{% if game.slug == 'emerald' %}bg-[#059669] text-white shadow-[2px_2px_0px_#064e3b]{% elif game.slug == 'ruby' %}bg-rose-900 text-white shadow-[2px_2px_0px_#4c0519]{% elif game.slug == 'sapphire' %}bg-[#0f3870] text-white shadow-[2px_2px_0px_#082046]{% elif game.slug == 'firered' %}bg-[#ea580c] text-white shadow-[2px_2px_0px_#7c2d12]{% elif game.slug == 'leafgreen' %}bg-[#16a34a] text-white shadow-[2px_2px_0px_#14532d]{% else %}bg-slate-900 text-white shadow-[2px_2px_0px_#0f172a]{% endif %}"
    data-inactive-classes="bg-white hover:bg-slate-100 text-slate-800 shadow-[2px_2px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none"
    data-badge-active="bg-black/25 text-white border-white/30"
    data-badge-inactive="bg-slate-100 text-slate-700 border-slate-300"
    class="px-2.5 sm:px-3 py-2 bg-[#f8f9fa] border-t-2 border-slate-950 flex items-center gap-2 overflow-x-auto flex-nowrap scrollbar-none select-none"
>
    <!-- Etiqueta de sección estilo Arcade -->
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-900 text-amber-300 text-[10px] sm:text-xs font-black uppercase tracking-wider shrink-0 border-2 border-slate-950 shadow-[2px_2px_0px_#0f172a]">
        <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <span>Región</span>
    </div>

    <!-- Lista de Botones de Región/Generación disponibles en este cartucho -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        {% for reg in national_regions_ctx.regions %}
        <a 
            href="{{ reg.url }}" 
            id="btn-nat-gen-{{ reg.slug }}"
            data-slug="{{ reg.slug }}"
            data-start="{{ reg.start_id }}"
            data-end="{{ reg.end_id }}"
            data-active="{% if reg.is_active %}true{% else %}false{% endif %}"
            onclick="switchNationalRegion('{{ reg.slug }}', event)"
            title="Ver Pokémon de {{ reg.name }} (#{{ reg.start_id|stringformat:'03d' }} - #{{ reg.end_id|stringformat:'03d' }})"
            class="h-8 sm:h-9 flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 rounded-xl border-2 border-slate-950 text-xs font-black uppercase transition-all shrink-0 cursor-pointer {% if reg.is_active %}{% if game.slug == 'emerald' %}bg-[#059669] text-white shadow-[2px_2px_0px_#064e3b]{% elif game.slug == 'ruby' %}bg-rose-900 text-white shadow-[2px_2px_0px_#4c0519]{% elif game.slug == 'sapphire' %}bg-[#0f3870] text-white shadow-[2px_2px_0px_#082046]{% elif game.slug == 'firered' %}bg-[#ea580c] text-white shadow-[2px_2px_0px_#7c2d12]{% elif game.slug == 'leafgreen' %}bg-[#16a34a] text-white shadow-[2px_2px_0px_#14532d]{% else %}bg-slate-900 text-white shadow-[2px_2px_0px_#0f172a]{% endif %}{% else %}bg-white hover:bg-slate-100 text-slate-800 shadow-[2px_2px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none{% endif %}"
        >
            <span>{{ reg.name }}</span>
            <span 
                id="nat-reg-badge-{{ reg.slug }}"
                class="text-[10px] px-1.5 py-0.5 rounded-md font-mono font-black border leading-none {% if reg.is_active %}bg-black/25 text-white border-white/30{% else %}bg-slate-100 text-slate-700 border-slate-300{% endif %}"
            >
                <span id="nat-reg-caught-{{ reg.slug }}">{{ reg.display_caught }}</span>/{{ reg.total }}
            </span>
        </a>
        {% endfor %}
    </div>
</div>
