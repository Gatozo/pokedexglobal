<!-- Modal del Mapa de Pesca de Feebas en Ruta 119 (Estilo Cómic) -->
<div 
    id="feebas-map-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-slate-950/85 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-200 select-none hidden"
    onclick="handleFeebasMapBackdropClick(event)"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
>
    <div 
        id="feebas-map-modal-card" 
        class="bg-[#fffef5] border-4 border-slate-950 rounded-2xl w-full max-w-4xl shadow-[8px_8px_0px_0px_#0f172a] transform scale-95 transition-all duration-200 overflow-hidden flex flex-col max-h-[95vh]"
        onclick="event.stopPropagation()"
    >
        <!-- Header del Modal -->
        <div class="bg-sky-400 border-b-4 border-slate-950 px-4 py-3 sm:px-5 sm:py-3.5 flex items-center justify-between gap-3 comic-header-pattern relative shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-lg border-2 border-slate-950 bg-white flex items-center justify-center shadow-[1.5px_1.5px_0px_0px_#0f172a] shrink-0">
                    <span class="text-base select-none">🗺️</span>
                </div>
                <div class="min-w-0">
                    <h3 class="text-base sm:text-lg font-black text-slate-950 uppercase tracking-tight truncate leading-tight">
                        Mapa de Pesca de Feebas • Ruta 119
                    </h3>
                    <p class="text-[11px] font-bold text-slate-900 leading-none mt-0.5">
                        {{ game.display_name }} (Hoenn)
                    </p>
                </div>
            </div>
            
            <button 
                type="button" 
                onclick="closeFeebasMapModal()"
                class="w-8 h-8 rounded-xl border-2 border-slate-950 bg-white text-slate-900 hover:bg-rose-500 hover:text-white transition-colors flex items-center justify-center font-black text-sm shadow-[2px_2px_0px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 cursor-pointer shrink-0"
                aria-label="Cerrar mapa"
            >
                ✕
            </button>
        </div>

        <!-- Barra de Control Rápido y Salto a Casillas -->
        <div class="bg-slate-100 border-b-2 border-slate-950 px-3 py-2 sm:px-4 sm:py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
            <!-- Botones de sección de la ruta -->
            <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] font-black uppercase text-slate-600 mr-1 hidden sm:inline">Zona:</span>
                <button 
                    type="button" 
                    onclick="scrollFeebasMapTo('north')" 
                    class="px-2.5 py-1 text-[11px] font-black uppercase tracking-wider rounded-lg border border-slate-950 bg-white hover:bg-sky-100 text-slate-800 shadow-[1px_1px_0px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 cursor-pointer"
                >
                    🏔️ Norte (Cascada)
                </button>
                <button 
                    type="button" 
                    onclick="scrollFeebasMapTo('center')" 
                    class="px-2.5 py-1 text-[11px] font-black uppercase tracking-wider rounded-lg border border-slate-950 bg-white hover:bg-sky-100 text-slate-800 shadow-[1px_1px_0px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 cursor-pointer"
                >
                    🏛️ Centro (Inst. Meteorológico)
                </button>
                <button 
                    type="button" 
                    onclick="scrollFeebasMapTo('south')" 
                    class="px-2.5 py-1 text-[11px] font-black uppercase tracking-wider rounded-lg border border-slate-950 bg-white hover:bg-sky-100 text-slate-800 shadow-[1px_1px_0px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 cursor-pointer"
                >
                    🌲 Sur (Ruta 118)
                </button>
            </div>

            <!-- Botones de salto a casillas calculadas -->
            <div id="feebas-spots-jump-nav" class="flex items-center gap-1 flex-wrap">
                <!-- Se llena dinámicamente con los 6 botones de casillas -->
            </div>
        </div>

        <!-- Contenedor del Mapa con Scroll -->
        <div id="feebas-map-viewport" class="flex-1 overflow-auto bg-slate-900 p-2 sm:p-4 flex justify-center relative min-h-[350px]">
            <div id="feebas-map-stage" class="relative inline-block border-2 border-slate-950 rounded shadow-2xl bg-black shrink-0" style="width: 640px; height: 2240px;">
                <img 
                    id="feebas-map-img" 
                    src="/media/maps/{% if game.slug == 'emerald' %}emerald{% else %}ruby-sapphire{% endif %}/route-119.png" 
                    alt="Mapa de la Ruta 119 de Hoenn" 
                    class="block w-[640px] h-[2240px] pixel-art pointer-events-none select-none"
                    loading="eager"
                >
                <!-- Capa de marcadores dinámicos calculados -->
                <div id="feebas-map-markers-layer" class="absolute inset-0 pointer-events-auto">
                    <!-- Marcadores inyectados dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Footer Informativo -->
        <div class="bg-amber-50 border-t-2 border-slate-950 p-2.5 sm:p-3 flex flex-col sm:flex-row items-center justify-between gap-2 shrink-0 text-slate-900">
            <div class="flex items-center gap-2 text-xs font-bold">
                <span class="w-3 h-3 rounded-full bg-rose-600 border border-slate-950 animate-pulse shrink-0"></span>
                <span>
                    En estas 6 casillas Feebas tiene un <strong>50% de probabilidad</strong> de pesca con Caña Vieja, Caña Buena o Supercaña.
                </span>
            </div>
            <div class="flex items-center gap-2">
                <button 
                    type="button" 
                    onclick="closeFeebasMapModal(); openGameConfigModal();" 
                    class="text-xs font-black uppercase text-amber-950 underline hover:text-amber-800 cursor-pointer whitespace-nowrap"
                >
                    ⚙️ Cambiar Frase / TID
                </button>
            </div>
        </div>
    </div>
</div>
