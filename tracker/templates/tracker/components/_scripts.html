{% load static %}
<!-- Inyección de Configuración y Métricas del Servidor (0 ms JS Overhead) -->
<script id="pokedex-server-config">
    window.POKEDEX_CONFIG = {
        gameSlug: "{{ game.slug }}",
        gameDisplayName: "{{ game.display_name|escapejs }}",
        gameGeneration: {{ game.generation|default:1 }},
        isShinydexActive: {% if is_shinydex_active %}true{% else %}false{% endif %},
        evolutionStonesCatalog: JSON.parse('{{ evolution_stones_json|escapejs }}'),
        normalStats: {
            caught: parseInt(document.getElementById('initial-normal-caught')?.value || "{{ caught_count|default:0 }}", 10),
            percent: parseFloat(document.getElementById('initial-normal-percent')?.value || "{{ caught_percent|default:0.0 }}")
        },
        shinyStats: {
            caught: parseInt(document.getElementById('initial-shiny-caught')?.value || "{{ shiny_caught_count|default:0 }}", 10),
            percent: parseFloat(document.getElementById('initial-shiny-percent')?.value || "{{ shiny_caught_percent|default:0.0 }}")
        },
        unownStats: {
            normal: {
                caught: parseInt("{{ unown_normal_count|default:0 }}", 10),
                percent: parseFloat("{{ unown_normal_percent|default:0.0 }}")
            },
            shiny: {
                caught: parseInt("{{ unown_shiny_count|default:0 }}", 10),
                percent: parseFloat("{{ unown_shiny_percent|default:0.0 }}")
            }
        }
    };
</script>

<!-- Controlador Modular de Interacciones y Modales (ES Modules) -->
<script type="module" src="{% static 'tracker/js/main.js' %}"></script>
