<!-- Filter & Visual Controls (Estilo Mecánico / Arcade) -->
<div class="p-2.5 sm:p-3 bg-[#fffef9] flex flex-col md:flex-row gap-2 sm:gap-2.5 items-stretch md:items-center justify-between">
    <!-- Search input -->
    <div class="relative w-full md:w-36 lg:w-44 xl:w-56 shrink-0">
        <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar Pokémon..." 
            class="w-full bg-white border-2 border-slate-950 rounded-xl pl-8 pr-2.5 py-1.5 text-xs sm:text-sm font-bold text-slate-900 placeholder-slate-400 shadow-[2px_2px_0px_#0f172a] focus:outline-none focus:bg-amber-50/40 transition"
            oninput="filterCards()"
        >
        <svg class="w-3.5 h-3.5 text-slate-600 absolute left-2.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>

    <div class="flex items-center gap-1 sm:gap-1.5 justify-start md:justify-end shrink-0 flex-nowrap overflow-x-auto max-w-full pb-0.5 md:pb-0">
        <!-- Botón de Exclusivos de Versión -->
        {% if exclusives_info and exclusives_info.has_exclusives %}
        <button 
            type="button" 
            onclick="openExclusivesModal()" 
            id="btn-exclusives" 
            class="flex items-center gap-1.5 px-2 py-1 rounded-xl border-2 border-slate-950 bg-white hover:bg-slate-50 text-xs font-black uppercase text-slate-900 shadow-[2px_2px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer group shrink-0"
            title="Ver Pokémon {{ exclusives_info.full_button_label|lower }}"
        >
            <span class="w-2.5 h-2.5 rounded-full {% if exclusives_info.counterpart_theme == 'blue' %}bg-blue-600{% elif exclusives_info.counterpart_theme == 'amber' %}bg-amber-500{% elif exclusives_info.counterpart_theme == 'silver' %}bg-slate-400{% elif exclusives_info.counterpart_theme == 'gold' %}bg-[#c59b27]{% else %}bg-red-600{% endif %} border border-slate-950 shrink-0"></span>
            <span class="{% if exclusives_info.counterpart_theme == 'blue' %}text-blue-600 group-hover:text-blue-800{% elif exclusives_info.counterpart_theme == 'amber' %}text-amber-600 group-hover:text-amber-800{% elif exclusives_info.counterpart_theme == 'silver' %}text-slate-600 group-hover:text-slate-800{% elif exclusives_info.counterpart_theme == 'gold' %}text-[#9e7514] group-hover:text-[#78590c]{% else %}text-red-600 group-hover:text-red-800{% endif %}">
                {{ exclusives_info.button_label }}
            </span>
            <span class="text-[10px] px-1.5 py-0.5 rounded-md font-mono font-black bg-slate-100 text-slate-900 border border-slate-950 shrink-0">
                <span id="exclusives-counterpart-caught-badge">{{ exclusives_info.counterpart_caught }}</span>/{{ exclusives_info.counterpart_total }}
            </span>
        </button>
        {% endif %}

        <!-- Botón de Pokémon a Transferir -->
        {% if transfers_info and transfers_info.has_transfers %}
        <button 
            type="button" 
            onclick="openTransfersModal()" 
            id="btn-transfers" 
            class="flex items-center gap-1.5 px-2 py-1 rounded-xl border-2 border-slate-950 bg-white hover:bg-slate-50 text-xs font-black uppercase text-slate-900 shadow-[2px_2px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer group shrink-0"
            title="Ver Pokémon a transferir ({{ transfers_info.mechanic_title }})"
        >
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 border border-slate-950 shrink-0"></span>
            <span class="text-indigo-600 group-hover:text-indigo-800">
                {{ transfers_info.button_label }}
            </span>
            <span class="text-[10px] px-1.5 py-0.5 rounded-md font-mono font-black bg-slate-100 text-slate-900 border border-slate-950 shrink-0">
                <span id="transfers-caught-badge">{{ transfers_info.caught }}</span>/{{ transfers_info.total }}
            </span>
        </button>
        {% endif %}

        <!-- Retro/Modern Visual Mode -->
        {% if game.has_retro_sprites %}
        <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border-2 border-slate-950 shadow-[2px_2px_0px_#0f172a] shrink-0">
            <button onclick="setSpriteStyle('retro')" id="btn-style-retro" class="px-2 py-1 rounded-lg text-xs font-black uppercase transition flex items-center gap-1 border-2 border-slate-950 shadow-[1.5px_1.5px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 {% if game.slug == 'blue' %}bg-blue-600 text-white{% elif game.slug == 'yellow' %}bg-amber-400 text-slate-950{% elif game.slug == 'gold' %}bg-[#c59b27] text-slate-950 font-black{% else %}bg-red-600 text-white{% endif %}">
                <img src="{% if game.generation == 2 %}/media/pokemon/icons/classic_gen2/archetypes/monster.png{% else %}/media/pokemon/icons/classic_gen1/archetypes/mon.png{% endif %}" alt="Retro" class="w-3.5 h-3.5 object-contain inline-block [image-rendering:pixelated]"> Retro
            </button>
            <button onclick="setSpriteStyle('modern')" id="btn-style-modern" class="px-2 py-1 rounded-lg text-xs font-bold uppercase text-slate-600 hover:text-slate-950 transition flex items-center gap-1 border border-transparent">
                Ilustración
            </button>
        </div>
        {% endif %}

        <!-- Status Tabs -->
        <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border-2 border-slate-950 shadow-[2px_2px_0px_#0f172a] shrink-0">
            <button onclick="setStatusFilter('all')" id="filter-all" class="px-2 py-1 rounded-lg text-xs font-black uppercase transition border-2 border-slate-950 shadow-[1.5px_1.5px_0px_#0f172a] active:translate-x-0.5 active:translate-y-0.5 {% if game.slug == 'blue' %}bg-blue-600 text-white{% elif game.slug == 'yellow' %}bg-amber-400 text-slate-950{% elif game.slug == 'gold' %}bg-[#c59b27] text-slate-950 font-black{% else %}bg-red-600 text-white{% endif %}">Todos</button>
            <button onclick="setStatusFilter('caught')" id="filter-caught" class="px-2 py-1 rounded-lg text-xs font-bold uppercase text-slate-600 hover:text-slate-950 transition border border-transparent">Capturados</button>
            <button onclick="setStatusFilter('uncaught')" id="filter-uncaught" class="px-2 py-1 rounded-lg text-xs font-bold uppercase text-slate-600 hover:text-slate-950 transition border border-transparent">Pendientes</button>
        </div>
    </div>
</div>
